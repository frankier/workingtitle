[project]
name = "workingtitle"
version = "0.1.0"
description = "Query-parameter validation for Starlette handlers, backed by Pydantic models"
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "starlette>=0.37",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
test = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workingtitle"
