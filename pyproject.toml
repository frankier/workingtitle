[project]
name = "workingtitle"
version = "0.1.0"
description = "Small web-app helpers for validation, desktop hosting, and packaging"
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "starlette>=0.37",
]

[project.optional-dependencies]
desktop = [
    "uvicorn>=0.30",
    "websockets>=12",
    "pywebview>=6; sys_platform != 'linux'",
    "watchfiles>=1",
    "pyinstaller>=6",
    "pyinstaller-hooks-contrib",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
test = [
    "pytest>=8",
    "uvicorn>=0.30",
    "websockets>=12",
    "watchfiles>=1",
]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "sphinx-autodoc-typehints>=2",
    "furo>=2024",
    "sphinx-polyversion[jinja]>=3",
]

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workingtitle"
